# Netlify Configuration for AgentSentry
# Supports:
# 1. Static React/Vite frontend edge delivery with SPA routing
# 2. Transparent Edge proxy to Google Cloud Run when BACKEND_URL is configured
# 3. Serverless API fallback when running exclusively on Netlify Functions

[build]
  command = "npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Edge Function: Dynamic streaming proxy to Cloud Run backend
[[edge_functions]]
  path = "/api/*"
  function = "api-proxy"

[[edge_functions]]
  path = "/v1/*"
  function = "api-proxy"

# Serverless Function redirects for full-stack Netlify fallback
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
